done = "build"
canceled = "build"
backlog = "build"

[[agents.labels]]
label = "rust"
agent = "rust-engineer"
precedence = 100
stages = ["todo"]

[[agents.labels]]
label = "typescript"
agent = "typescript-engineer"
precedence = 100
stages = ["todo"]

[[agents.labels]]
label = "python"
agent = "python-engineer"
precedence = 100
stages = ["todo"]

[[agents.labels]]
label = "review"
agent = "code-reviewer"
precedence = 50
stages = ["in_review"]


[self_defects]
