processed_states = ["Backlog"]

[states]
todo = "Todo"
in_progress = "In Progress"
in_review = "In Review"
need_owner_input = "Need Owner Input"
done = "Done"
canceled = "Canceled"
backlog = "Backlog"

[agents.default]
todo = "build"
in_progress = "build"
in_review = "code-reviewer"
